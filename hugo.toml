baseUrl = 'https://flutter-explained.dev/'
languageCode = 'en-us'
title = 'Max Weber - Developer, Publisher and Father'

theme = "ManaQuest"
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
[minify]
disableXML = true
minifyOutput = true

[params]
social = true
env = "production"
title = "Max Weber"
description = "Developer, Publisher and Father"
keywords = ["Flutter", "Rust", "hledger", "blog", "developer"]
author = "Max Weber"
images = ["/assets/og-default.png"]
themeColor = "#0f1020"
DateFormat = "January 2, 2006"
defaultTheme = "auto"
disableThemeToggle = false
ShowReadingTime = true
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = true
ShowRssButtonInSectionTermList = true
UseHugoToc = true
disableSpecial1stPost = false
disableScrollToTop = false
comments = false
hidemeta = false
hideSummary = false
showtoc = false
tocopen = false

[params.hero]
title = "Engineer & storyteller."
subtitle = "I'm Max — software engineer by trade, creator of Flutter Explained on YouTube, dad of two, and a voluntary scout trainer for wolf cubs. I build apps in Flutter and tools in Rust, and I treat every great game as a masterclass in storytelling. This blog is where my code, my craft, and my side quests meet."

