{{ define "main" }}
  <section class="section-block panel panel-loose">
    <header class="section-header">
      <h1>{{ .Title }}</h1>
      <span class="section-slot">{{ len .Data.Terms }}&nbsp;TAGS</span>
    </header>
    <div class="terms-list">
      {{ range .Data.Terms.Alphabetical }}
        <a class="term-chip" href="{{ .Page.RelPermalink }}">
          #{{ .Page.Title }} <span>{{ .Count }}</span>
        </a>
      {{ end }}
    </div>
  </section>
{{ end }}
