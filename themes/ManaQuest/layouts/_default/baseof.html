<!doctype html>
<html lang="{{ .Site.Language.Lang | default "en" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <div class="page-frame">
    {{ partial "header.html" . }}

  <script src="{{ "js/lightbox.js" | relURL }}" defer></script>
  <script src="{{ "js/youtube-embed.js" | relURL }}" defer></script>
</body>
</html>
